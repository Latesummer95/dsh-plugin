# dsh-probe bundle patch.
#
# Adds ONE host row: the merged panel that mounts both probes. The two halves
# (`dsh-coding-probe`, `dsh-fingerprint-probe`) stay independent packages and are
# pulled in as dependencies, not re-declared here.
#
# A patch replaces the targeted row's whole `config`, so this file contains only
# an additive `insert` row and never restates a shipped row. `name` resolves
# relative to this file.
#
# Optional config — anything outside `coding` / `fingerprint` is shared by both
# halves, and each half's own slice overrides the shared value:
#
#   config:
#     provider: ""            # shared; empty = every configured provider
#     concurrency: 1          # shared
#     coding:
#       modelPattern: ""      # empty = no filter
#       reasoningEffort: null # null omits the field
#       complexTrials: 3
#     fingerprint:
#       languages: [zh, en]   # empty = all five
#       reasoningEffort: null
#       spacingMs: 1500
#
# No provider id is named here on purpose. These defaults ship to every profile,
# and a route id that only exists on the author's machine is either a hard
# failure (`listModels` on an unknown provider) or a silent preselection of
# models the user never configured. Empty means "read what this profile has".
- insert:
    # The halves stay loader entries: each owns its own routes and its own client
    # bundle, and `dsh-probe/client.js` requires them by name. They no longer add
    # a rail button — `window.__DSH_PROBE_MERGED__` turns each into a tab instead.
    - id: coding-probe
      name: 'dsh-coding-probe'
    - id: fingerprint-probe
      name: 'dsh-fingerprint-probe'
    - id: probe
      name: './index.js'
      config:
        concurrency: 1
        coding:
          provider: ""
          # `null` omits the field. Sending an effort the route does not accept
          # fails every probe, which looks like a degraded model rather than a
          # misconfiguration — so the shipped default is to omit it.
          reasoningEffort: null
          complexTrials: 3
        fingerprint:
          provider: ""
          reasoningEffort: null
          spacingMs: 1500
